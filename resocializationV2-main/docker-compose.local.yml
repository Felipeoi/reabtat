services:
  db:
    image: postgres:15
    container_name: resocializationv2-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1212"
      POSTGRES_DB: resocialization_v2
    ports:
      - "5433:5432"
    volumes:
      - resocializationv2_local_pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: resocializationv2-redis
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  resocializationv2_local_pgdata:
